<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桃園國際民俗舞社-許願清單</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1, h2 {
            text-align: center;
            color: #2c3e50;
        }
        h1 { margin-bottom: 30px; border-bottom: 2px solid #3498db; padding-bottom: 10px;}
        
        .toggle-form-btn {
            width: 100%;
            padding: 14px;
            background-color: #2e7d32; /* 初始状态：綠色 */
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        .toggle-form-btn:hover {
            background-color: #1b5e20;
        }
        .toggle-form-btn:active {
            transform: scale(0.99);
        }

        .form-container {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out, opacity 0.3s ease-out;
            opacity: 0;
            background: #fafafa;
            border-radius: 6px;
            margin-bottom: 0;
        }
        .form-container.open {
            max-height: 500px;
            opacity: 1;
            padding: 15px;
            border: 1px solid #e0e0e0;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        input[type="text"]:focus {
            border-color: #3498db;
            outline: none;
        }
        
        /* 💡 修正：「送出願望」按鈕改為紅色（#e74c3c） */
        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #e74c3c; 
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .submit-btn:hover {
            background-color: #c0392b;
        }
        
        .ranking-section {
            margin-top: 30px;
            border-top: 2px dashed #ccc;
            padding-top: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f2f2f2;
            color: #2c3e50;
        }
        tr:nth-child(even) { background-color: #fafafa; }
        .rank-num {
            font-weight: bold;
            color: #e74c3c;
            width: 50px;
        }
        
        /* 舞名比對成功時變紅色與粗體 */
        .match-dance {
            color: #e74c3c;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            color: #7f8c8d;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>桃園國際民俗舞社<br><span style="font-size: 18px; color: #7f8c8d; display: block; margin-top: 5px;">🌳 舞蹈許願樹 🌳</span></h1>
    
    <button type="button" id="toggleFormBtn" class="toggle-form-btn">🎋 我要許願</button>

    <div id="formContainer" class="form-container">
        <form id="wishForm">
            <div class="form-group">
                <label for="name">您的姓名：</label>
                <input type="text" id="name" required placeholder="請輸入姓名或暱稱">
            </div>
            <div class="form-group">
                <label for="wantToLearn">想學的舞（選填）：</label>
                <input type="text" id="wantToLearn" placeholder="請輸入舞蹈名稱">
            </div>
            <div class="form-group">
                <label for="wantToTeach">想教的舞（選填）：</label>
                <input type="text" id="wantToTeach" placeholder="若有想分享的舞請填寫">
            </div>
            <!-- 💡 修正：送出按鈕文字前加上 🎋 插圖 -->
            <button type="submit" id="submitBtn" class="submit-btn">🎋 送出願望</button>
        </form>
    </div>

    <!-- 排行榜區塊 -->
    <div class="ranking-section">
        <h2>🔥 熱門學舞排行榜</h2>
        <div id="loadingText" class="loading">排行榜資料載入中...</div>
        <table id="rankingTable" style="display: none;">
            <thead>
                <tr>
                    <th class="rank-num">名次</th>
                    <th>舞蹈名稱</th>
                    <th style="width: 80px; text-align: right;">想學人數</th>
                </tr>
            </thead>
            <tbody id="rankingBody">
                <!-- 資料會由 JavaScript 自動生成 -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const GAS_URL = "https://google.com";

    document.addEventListener("DOMContentLoaded", fetchRanking);

    const toggleFormBtn = document.getElementById("toggleFormBtn");
    const formContainer = document.getElementById("formContainer");

    toggleFormBtn.addEventListener("click", function() {
        formContainer.classList.toggle("open");
        if (formContainer.classList.contains("open")) {
            // 💡 修正：「收起表單」時，大按鈕改為深綠色（#2e7d32）
            toggleFormBtn.innerText = "❌ 收起表單";
            toggleFormBtn.style.backgroundColor = "#2e7d32"; 
        } else {
            toggleFormBtn.innerText = "🎋 我要許願";
            toggleFormBtn.style.backgroundColor = "#2e7d32";
        }
    });

    // 處理表單提交事件
    document.getElementById("wishForm").addEventListener("submit", function(e) {
        e.preventDefault();
        
        const wantToLearnVal = document.getElementById("wantToLearn").value.trim();
        const wantToTeachVal = document.getElementById("wantToTeach").value.trim();

        if (wantToLearnVal === "" && wantToTeachVal === "") {
            alert("❌ 「想學的舞」或「想教的舞」請至少填寫一欄才能許願喔！");
            return;
        }

        const submitBtn = document.getElementById("submitBtn");
        submitBtn.disabled = true;
        submitBtn.innerText = "資料送出中...";

        const formData = {
            name: document.getElementById("name").value,
            wantToLearn: wantToLearnVal,
            wantToTeach: wantToTeachVal
        };

        fetch(GAS_URL, {
            method: "POST",
            mode: "no-cors", 
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(formData)
        })
        .then(() => {
            alert("✨ 許願成功！您的心願已掛上許願樹！");
            
            document.getElementById("wantToLearn").value = "";
            document.getElementById("wantToTeach").value = "";
            
            submitBtn.disabled = false;
            submitBtn.innerText = "🎋 送出願望";
            
            formContainer.classList.remove("open");
            toggleFormBtn.innerText = "🎋 我要許願";
            toggleFormBtn.style.backgroundColor = "#2e7d32";

            fetchRanking();
        })
        .catch(error => {
            console.error("Error:", error);
            alert("送出失敗，請稍後再試。");
            submitBtn.disabled = false;
            submitBtn.innerText = "🎋 送出願望";
        });
    });

    // 獲取並更新排行榜
    function fetchRanking() {
        const loadingText = document.getElementById("loadingText");
        const rankingTable = document.getElementById("rankingTable");
        const rankingBody = document.getElementById("rankingBody");

        loadingText.style.display = "block";
        rankingTable.style.display = "none";

        fetch(GAS_URL)
        .then(response => response.json())
        .then(data => {
            rankingBody.innerHTML = "";
            
            if (data.length === 0) {
                loadingText.innerText = "目前尚無許願資料，快來當第一個吧！";
                return;
            }

            data.forEach((item, index) => {
                const row = document.createElement("tr");
                
                let danceClass = item.isMatch ? "class=\"match-dance\"" : "";

                // 💡 修正：已將原本舞名前面的 💃 貼圖移除，改為純文字
                row.innerHTML = `
                    <td class="rank-num">${index + 1}</td>
                    <td ${danceClass}>${item.dance}</td>
                    <td style="text-align: right;">${item.count} 票</td>
                `;
                rankingBody.appendChild(row);
            });

            loadingText.style.display = "none";
            rankingTable.style.display = "table";
        })
        .catch(error => {
            console.error("Error:", error);
            loadingText.innerText = "無法載入排行榜資料，請重新整理網頁。";
        });
    }
</script>
</body>
</html>
