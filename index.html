<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桃園國際民俗舞社 - 舞蹈許願樹</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
            background-color: #fcfaf2; /* 溫潤的暖米色背景 */
            margin: 0;
            padding: 15px; /* 手機滿版微邊距 */
            color: #3e2723;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-bottom: 2px solid #e0e0e0;
            box-sizing: border-box;
        }
        .header-banner {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #2e7d32; /* 深綠色主要分隔線 */
        }
        h1 {
            font-size: 24px;
            color: #2e7d32; /* 深翠綠 */
            margin: 0;
            font-weight: bold;
        }
        h1 span {
            font-size: 16px;
            display: block;
            color: #d84315; /* 慶典橘紅 */
            margin-top: 5px;
            letter-spacing: 2px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #5d4037;
            font-size: 15px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #cccccc;
            font-size: 16px; /* 防止 iOS 點擊時自動放大的最佳尺寸 */
            background-color: #fff;
            color: #333;
        }
        input[type="text"]:focus {
            border-color: #2e7d32;
            outline: none;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #2e7d32;
            color: white;
            border: none;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            letter-spacing: 1px;
        }
        button:hover {
            background-color: #1b5e20;
        }
        .ranking-section {
            margin-top: 35px;
            padding-top: 20px;
        }
        h2 {
            text-align: center;
            color: #2e7d32;
            font-size: 18px;
            margin-bottom: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
            font-size: 15px;
        }
        th {
            background-color: #f5f5f5;
            color: #5d4037;
            font-weight: bold;
        }
        tr:nth-child(even) td { 
            background-color: #fbfbfa; 
        }
        .rank-num {
            font-weight: bold;
            width: 50px;
            text-align: center;
        }
        .rank-1 { color: #ffb300; }
        .rank-2 { color: #9e9e9e; }
        .rank-3 { color: #cd7f32; }
        .rank-other { color: #8d6e63; }
        
        .vote-count {
            text-align: right;
            font-weight: bold;
            color: #d84315;
            width: 80px;
        }
        .loading {
            text-align: center;
            color: #7f8c8d;
            font-style: italic;
            padding: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 頂部標題：回歸無圖案架構，維持「舞蹈許願樹」字樣 -->
    <div class="header-banner">
        <h1>桃園國際民俗舞社</h1>
        <h1><span>舞蹈許願樹</span></h1>
    </div>
    
    <!-- 許願表單：維持純文字無卡片框，融入許願樹情境提示 -->
    <form id="wishForm">
        <div class="form-group">
            <label for="name">舞士大名：</label>
            <input type="text" id="name" required placeholder="請輸入您的姓名或暱稱">
        </div>
        <div class="form-group">
            <label for="wantToLearn">最想學的舞蹈：</label>
            <input type="text" id="wantToLearn" required placeholder="請輸入您想掛上許願樹的舞碼名稱">
        </div>
        <div class="form-group">
            <label for="wantToTeach">願分享/教的舞蹈（選填）：</label>
            <input type="text" id="wantToTeach" placeholder="若有珍藏舞碼想分享請填寫">
        </div>
        <button type="submit" id="submitBtn">將心願掛上許願樹</button>
    </form>

    <!-- 排行榜佈告欄：文字融入許願樹主題 -->
    <div class="ranking-section">
        <h2>眾人祈願 · 最想學舞蹈排行</h2>
        <div id="loadingText" class="loading">正在召集許願樹數據中...</div>
        <table id="rankingTable" style="display: none;">
            <thead>
                <tr>
                    <th class="rank-num">名次</th>
                    <th>舞碼名稱</th>
                    <th class="vote-count">期待人數</th>
                </tr>
            </thead>
            <tbody id="rankingBody">
                <!-- 資料由 JavaScript 自動填入 -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzwXWm9nLJIrnQiOvqOPMjMptDH3tqPxpBVOLLB4bhSpbO8Mnn251qhk7Ix06Ka59XoYQ/exec";

    document.addEventListener("DOMContentLoaded", fetchRanking);

    document.getElementById("wishForm").addEventListener("submit", function(e) {
        e.preventDefault();
        
        const submitBtn = document.getElementById("submitBtn");
        submitBtn.disabled = true;
        submitBtn.innerText = "心願傳送中...";

        const formData = {
            name: document.getElementById("name").value,
            wantToLearn: document.getElementById("wantToLearn").value,
            wantToTeach: document.getElementById("wantToTeach").value
        };

        fetch(GAS_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(formData)
        })
        .then(() => {
            alert("許願成功！您的心願已掛上許願樹！");
            document.getElementById("wishForm").reset();
            submitBtn.disabled = false;
            submitBtn.innerText = "將心願掛上許願樹";
            fetchRanking();
        })
        .catch(error => {
            console.error("Error:", error);
            alert("送出失敗，請稍後再試。");
            submitBtn.disabled = false;
            submitBtn.innerText = "將心願掛上許願樹";
        });
    });

    function fetchRanking() {
        const loadingText = document.getElementById("loadingText");
        const rankingTable = document.getElementById("rankingTable");
        const rankingBody = document.getElementById("rankingBody");

        loadingText.style.display = "block";
        rankingTable.style.display = "none";
        
        fetch(GAS_URL)
        .then(response => response.json())
        .then(data => {
            rankingBody.innerHTML = "";
            if (data.length === 0) {
                loadingText.innerText = "許願樹上目前尚無資料，快來當第一個吧！";
                return;
            }
            
            data.forEach((item, index) => {
                const row = document.createElement("tr");
                
                let rankClass = "rank-other";
                if (index === 0) rankClass = "rank-1";
                else if (index === 1) rankClass = "rank-2";
                else if (index === 2) rankClass = "rank-3";
                
                row.innerHTML = `
                    <td class="rank-num ${rankClass}">${index + 1}</td>
                    <td>${item.dance}</td>
                    <td class="vote-count">${item.count} 票</td>
                `;
                rankingBody.appendChild(row);
            });
            
            loadingText.style.display = "none";
            rankingTable.style.display = "table";
        })
        .catch(error => {
            console.error("Error:", error);
            loadingText.innerText = "無法載入許願樹資料，請重新整理網頁。";
        });
    }
</script>
</body>
</html>
