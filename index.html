<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桃園國際民俗舞社-舞蹈許願池</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef5f8; 
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1, h2 {
            text-align: center;
            color: #2c3e50;
        }
        h1 { margin-bottom: 30px; border-bottom: 2px solid #2980b9; padding-bottom: 10px; color: #2980b9;}
        
        .toggle-form-btn {
            width: 100%;
            padding: 14px;
            background-color: #2980b9; 
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        .toggle-form-btn:hover {
            background-color: #1f618d;
        }
        .toggle-form-btn:active {
            transform: scale(0.99);
        }

        .form-container {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out, opacity 0.3s ease-out;
            opacity: 0;
            background: #fafafa;
            border-radius: 6px;
            margin-bottom: 0;
        }
        .form-container.open {
            max-height: 500px;
            opacity: 1;
            padding: 15px;
            border: 1px solid #e0e0e0;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        input[type="text"]:focus {
            border-color: #2980b9;
            outline: none;
        }
        
        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #e74c3c; 
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .submit-btn:hover {
            background-color: #c0392b;
        }
        
        .ranking-section {
            margin-top: 30px;
            border-top: 2px dashed #ccc;
            padding-top: 20px;
        }

        .tab-container {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
            border-bottom: 2px solid #ddd;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: #e0e0e0;
            color: #555;
            border: none;
            border-radius: 6px 6px 0 0;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .tab-btn.active {
            background: #2980b9; 
            color: white;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
        }
        th, td {
            padding: 12px 6px; 
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f2f2f2;
            color: #2c3e50;
            font-size: 15px;
        }
        tr:nth-child(even) { background-color: #fafafa; }
        
        .rank-num {
            font-weight: bold;
            color: #e74c3c;
            width: 40px;
            white-space: nowrap;
        }
        
        .dance-title-th {
            white-space: nowrap; 
        }

        .dance-name-cell {
            word-break: break-all; 
            color: #333;
        }
        
        .match-dance {
            color: #e74c3c;
            font-weight: bold;
        }

        .vote-count {
            text-align: right;
            white-space: nowrap; 
            width: 60px; 
            font-weight: bold;
        }

        .loading {
            text-align: center;
            color: #7f8c8d;
            font-style: italic;
            padding: 20px;
        }

        @media screen and (max-width: 480px) {
            body {
                padding: 10px; 
            }
            .container {
                padding: 20px 15px; 
            }
            th, .tab-btn {
                font-size: 12.5px; 
            }
            td {
                font-size: 14.5px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>桃園國際民俗舞社<br><span style="font-size: 18px; color: #7f8c8d; display: block; margin-top: 5px;">  ⛲ 舞蹈許願池 ⛲ </span></h1>
    
    <button type="button" id="toggleFormBtn" class="toggle-form-btn">🪙 投幣許願</button>

    <div id="formContainer" class="form-container">
        <form id="wishForm">
            <div class="form-group">
                <label for="name">您的姓名：</label>
                <input type="text" id="name" required placeholder="請輸入姓名或暱稱">
            </div>
            <div class="form-group">
                <label for="wantToLearn">想學的舞（選填）：</label>
                <input type="text" id="wantToLearn" placeholder="請輸入舞蹈名稱">
            </div>
            <div class="form-group">
                <label for="wantToTeach">想教的舞（選填）：</label>
                <input type="text" id="wantToTeach" placeholder="若有想分享的舞請填寫">
            </div>
            <button type="submit" id="submitBtn" class="submit-btn"> ⛲ 投入許願池</button>
        </form>
    </div>

    <!-- 排行榜區塊 -->
    <div class="ranking-section">
        <h2>🔥 許願池熱度排行</h2>
        
        <div class="tab-container">
            <button class="tab-btn active" id="learnTabBtn" onclick="switchTab('learn')">🌱 學舞許願單</button>
            <button class="tab-btn" id="teachTabBtn" onclick="switchTab('teach')">📢 教舞許願單</button>
        </div>

        <div id="loadingText" class="loading">排行榜資料載入中...</div>
        
        <table id="rankingTable" style="display: none;">
            <thead>
    <tr>
        <th class="rank-num">名次</th>
        <th class="dance-title-th">舞名(紅字表示許願成真)</th>
        <th id="nameHeader" style="min-width: 100px;">許願者</th> <!-- 💡 新增姓名欄位 -->
        <th class="vote-count" id="countHeader">熱度</th>
    </tr>
</thead>

            <tbody id="rankingBody">
                <!-- 資料會由 JavaScript 自動生成 -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // 💡 您的 Google Apps Script 網頁應用程式 URL
    const GAS_URL = "https://script.google.com/macros/s/AKfycbx098y0AkfyEQvaKKNCjsPek2J9nOa1JgJMbb3_aphGxl_jxi_i2ArVp7l-4Qo7HpkYAA/exec";

    let rawWishData = [];
    let currentTab = 'learn'; 

    document.addEventListener("DOMContentLoaded", fetchRanking);

    const toggleFormBtn = document.getElementById("toggleFormBtn");
    const formContainer = document.getElementById("formContainer");

    toggleFormBtn.addEventListener("click", function() {
        formContainer.classList.toggle("open");
        if (formContainer.classList.contains("open")) {
            toggleFormBtn.innerText = "❌ 收起表單";
            toggleFormBtn.style.backgroundColor = "#7f8c8d"; 
        } else {
            toggleFormBtn.innerText = "🪙 投幣許願";
            toggleFormBtn.style.backgroundColor = "#2980b9";
        }
    });

    document.getElementById("wishForm").addEventListener("submit", function(e) {
        e.preventDefault();
        
        const wantToLearnVal = document.getElementById("wantToLearn").value.trim();
        const wantToTeachVal = document.getElementById("wantToTeach").value.trim();

        if (wantToLearnVal === "" && wantToTeachVal === "") {
            alert("❌ 「想學的舞」或「想教的舞」請至少填寫一欄才能許願喔！");
            return;
        }

        const submitBtn = document.getElementById("submitBtn");
        submitBtn.disabled = true;
        submitBtn.innerText = "心願沉入池中...";

        const formData = {
            name: document.getElementById("name").value,
            wantToLearn: wantToLearnVal,
            wantToTeach: wantToTeachVal
        };

        fetch(GAS_URL, {
            method: "POST",
            mode: "no-cors", 
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(formData)
        })
        .then(() => {
            alert("✨ 許願成功！您的願望已沉入舞蹈許願池中！");
            document.getElementById("wantToLearn").value = "";
            document.getElementById("wantToTeach").value = "";
            submitBtn.disabled = false;
            submitBtn.innerText = " ⛲ 投入許願池";
            formContainer.classList.remove("open");
            toggleFormBtn.innerText = "🪙 投幣許願";
            toggleFormBtn.style.backgroundColor = "#2980b9";
            fetchRanking();
        })
        .catch(error => {
            console.error("Error:", error);
            alert("送出失敗，請稍後再試。");
            submitBtn.disabled = false;
            submitBtn.innerText = "⛲ 投入許願池";
        });
    });

    function fetchRanking() {
        const loadingText = document.getElementById("loadingText");
        const rankingTable = document.getElementById("rankingTable");

        loadingText.style.display = "block";
        rankingTable.style.display = "none";

        fetch(GAS_URL)
        .then(response => response.json())
        .then(data => {
            rawWishData = data;
            renderTable();
        })
        .catch(error => {
            console.error("Error:", error);
            loadingText.innerText = "無法載入許願池資料，請重新整理網頁。";
        });
    }

    function switchTab(tab) {
        if (currentTab === tab) return;
        currentTab = tab;
        document.getElementById('learnTabBtn').classList.toggle('active', tab === 'learn');
        document.getElementById('teachTabBtn').classList.toggle('active', tab === 'teach');
        
        // 💡 修正：動態切換第三欄與第四欄（熱度）的標題
        const nameHeader = document.getElementById('nameHeader');
        const countHeader = document.getElementById('countHeader');
        
        if (tab === 'learn') {
            nameHeader.innerText = "許願者";
            countHeader.style.display = "table-cell"; // 學舞分頁顯示熱度
        } else {
            nameHeader.innerText = "教舞老師";
            countHeader.style.display = "none";       // 教舞分頁隱藏人數與熱度
        }
        
        renderTable();
    }

    function renderTable() {
        const loadingText = document.getElementById("loadingText");
        const rankingTable = document.getElementById("rankingTable");
        const rankingBody = document.getElementById("rankingBody");
        rankingBody.innerHTML = "";
        
        if (!rawWishData || rawWishData.length === 0) {
            loadingText.innerText = "目前許願池空空如也，快來許下第一個願望吧！";
            return;
        }
        
        // 🧠 前端多重資料聚合引擎
        let learnData = {}; // 存放學舞的 { 舞名: { names: [], count: 0 } }
        let teachData = {}; // 存放教舞的 { 舞名: { names: [] } }
        
        rawWishData.forEach(item => {
            let userName = (item.name || "不具名").trim();
            
            // 歸納學舞資料
            if (item.wantToLearn && item.wantToLearn.trim() !== "") {
                let dLearn = item.wantToLearn.trim();
                if (!learnData[dLearn]) {
                    learnData[dLearn] = { names: [], count: 0 };
                }
                // 避免同一個人重複許願同一首舞時姓名重複列出
                if (!learnData[dLearn].names.includes(userName)) {
                    learnData[dLearn].names.push(userName);
                }
                learnData[dLearn].count++;
            }
            
            // 歸納教舞資料
            if (item.wantToTeach && item.wantToTeach.trim() !== "") {
                let dTeach = item.wantToTeach.trim();
                if (!teachData[dTeach]) {
                    teachData[dTeach] = { names: [] };
                }
                if (!teachData[dTeach].names.includes(userName)) {
                    teachData[dTeach].names.push(userName);
                }
            }
        });
        
        // 依據選取分頁產生列表
        let displayList = [];
        
        if (currentTab === 'learn') {
            for (let danceName in learnData) {
                let isMatch = teachData.hasOwnProperty(danceName);
                displayList.push({
                    dance: danceName,
                    namesStr: learnData[danceName].names.join('、'), // 💡 用頓號串聯多人姓名
                    count: learnData[danceName].count,
                    isMatch: isMatch
                });
            }
            // 學舞按照票數由多到少排序
            displayList.sort((a, b) => b.count - a.count);
            
        } else {
            for (let danceName in teachData) {
                let isMatch = learnData.hasOwnProperty(danceName);
                displayList.push({
                    dance: danceName,
                    namesStr: teachData[danceName].names.join('、'), // 💡 用頓號串聯多人姓名
                    count: 0, // 教舞不呈現計數
                    isMatch: isMatch
                });
            }
            // 教舞按照舞名筆劃排序（或可維持預設）
            displayList.sort((a, b) => a.dance.localeCompare(b.dance, 'zh-Hant'));
        }
        
        if (displayList.length === 0) {
            let emptyMsg = currentTab === 'learn' ? '目前尚無學舞許願資料。' : '目前尚無教舞許願資料。';
            rankingBody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#7f8c8d; font-style:italic; padding:20px;">' + emptyMsg + '</td></tr>';
            loadingText.style.display = "none";
            rankingTable.style.display = "table";
            return;
        }
        
        // 渲染生成表格
        displayList.forEach((item, index) => {
            const row = document.createElement("tr");
            let danceClass = item.isMatch ? "match-dance" : "";
            
            // 建立標準的四欄位架構，並依據分頁隱藏最後一欄
            let htmlContent = 
                '<td class="rank-num">' + (index + 1) + '</td>' +
                '<td class="dance-name-cell ' + danceClass + '">' + item.dance + '</td>' +
                '<td style="color: #555; font-size: 14px;">' + item.namesStr + '</td>';
                
            if (currentTab === 'learn') {
                htmlContent += '<td class="vote-count">' + item.count + ' 票</td>';
            } else {
                htmlContent += '<td class="vote-count" style="display:none;"></td>';
            }
            
            row.innerHTML = htmlContent;
            rankingBody.appendChild(row);
        });
        
        loadingText.style.display = "none";
        rankingTable.style.display = "table";
    }
</script>
