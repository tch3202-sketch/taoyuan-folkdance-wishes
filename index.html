<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桃園國際民俗舞社-舞蹈許願池</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef5f8; 
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1, h2 {
            text-align: center;
            color: #2c3e50;
        }
        h1 { margin-bottom: 30px; border-bottom: 2px solid #2980b9; padding-bottom: 10px; color: #2980b9;}
        
        .toggle-form-btn {
            width: 100%;
            padding: 14px;
            background-color: #2980b9; 
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        .toggle-form-btn:hover {
            background-color: #1f618d;
        }
        .toggle-form-btn:active {
            transform: scale(0.99);
        }

        .form-container {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out, opacity 0.3s ease-out;
            opacity: 0;
            background: #fafafa;
            border-radius: 6px;
            margin-bottom: 0;
        }
        .form-container.open {
            max-height: 500px;
            opacity: 1;
            padding: 15px;
            border: 1px solid #e0e0e0;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        input[type="text"]:focus {
            border-color: #2980b9;
            outline: none;
        }
        
        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #e74c3c; 
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .submit-btn:hover {
            background-color: #c0392b;
        }
        
        .ranking-section {
            margin-top: 30px;
            border-top: 2px dashed #ccc;
            padding-top: 20px;
        }

        .tab-container {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
            border-bottom: 2px solid #ddd;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: #e0e0e0;
            color: #555;
            border: none;
            border-radius: 6px 6px 0 0;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .tab-btn.active {
            background: #2980b9; 
            color: white;
        }

        .ranking-scroll-container {
            max-height: 380px; 
            overflow-y: auto;   
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            -webkit-overflow-scrolling: touch; 
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0;
        }
        th, td {
            padding: 12px 6px; 
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        th {
            background-color: #f2f2f2;
            color: #2c3e50;
            font-size: 15px;
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: inset 0 -1px 0 #ddd; 
        }
        tr:nth-child(even) { background-color: #fafafa; }
        
        .rank-num {
    font-weight: bold;
    color: #e74c3c;
    width: 40px;
    white-space: nowrap;
    text-align: center; /* 💡 核心修正：讓名次/熱度數字完美水平置中 */
}

        
        .dance-title-th {
            white-space: nowrap; 
        }

        .dance-name-cell {
            word-break: break-all; 
            color: #333;
        }
        
        .match-dance {
            color: #e74c3c;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            color: #7f8c8d;
            font-style: italic;
            padding: 20px;
        }

        @media screen and (max-width: 480px) {
            body {
                padding: 10px; 
            }
            .container {
                padding: 20px 15px; 
            }
            th, .tab-btn {
                font-size: 12.5px; 
            }
            td {
                font-size: 14.5px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>桃園國際民俗舞社<br><span style="font-size: 18px; color: #7f8c8d; display: block; margin-top: 5px;">⛲⛲⛲ 舞蹈許願池 ⛲⛲⛲</span></h1>
    
    <button type="button" id="toggleFormBtn" class="toggle-form-btn">🪙 投幣許願</button>

    <div id="formContainer" class="form-container">
        <form id="wishForm">
            <div class="form-group">
                <label for="name">您的姓名：</label>
                <input type="text" id="name" required placeholder="請輸入姓名或暱稱">
            </div>
            <div class="form-group">
                <label for="wantToLearn">想學的舞（選填）：</label>
                <input type="text" id="wantToLearn" placeholder="請輸入舞蹈名稱">
            </div>
            <div class="form-group">
                <label for="wantToTeach">想教的舞（選填）：</label>
                <input type="text" id="wantToTeach" placeholder="若有想分享的舞請填寫">
            </div>
            <button type="submit" id="submitBtn" class="submit-btn">⛲ 投入許願池</button>
        </form>
    </div>

    <div class="ranking-section">
        <h2>🔥 許願池熱度排行</h2>
        
        <div class="tab-container">
            <button class="tab-btn active" id="learnTabBtn" onclick="switchTab('learn')">🌱 學舞許願單</button>
            <button class="tab-btn" id="teachTabBtn" onclick="switchTab('teach')">📢 教舞許願單</button>
        </div>

        <div id="loadingText" class="loading">排行榜資料載入中...</div>
        
        <div id="scrollContainer" class="ranking-scroll-container" style="display: none;">
            <table id="rankingTable">
                <thead>
                    <!-- 💡 優化：表格頂部完全精簡為名次、舞名、人員三欄，去除票數標題 -->
                    <tr>
                        <th class="rank-num">熱度</th>
                        <th class="dance-title-th">舞名(紅字表示許願成真)</th>
                        <th id="nameHeader">許願者</th>
                    </tr>
                </thead>
                <tbody id="rankingBody">
                    <!-- 資料會由 JavaScript 自動生成 -->
                </tbody>
            </table>
        </div>
    </div>
</div>
<script>
    // 💡 ⚠️ 請將引號內的網址替換成您在 Google 試算表 Apps Script「新部署」得到的最新網頁應用程式網址！
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyCU3FvypIyjuJFs-BFVSFIq0J6WP2xL2vIqS8XJuzw6Cc0gzv9EmBDI5z6Ht714YpZ/exec";

    let rawWishData = [];
    let currentTab = 'learn'; 

    document.addEventListener("DOMContentLoaded", fetchRanking);

    const toggleFormBtn = document.getElementById("toggleFormBtn");
    const formContainer = document.getElementById("formContainer");

    toggleFormBtn.addEventListener("click", function() {
        formContainer.classList.toggle("open");
        if (formContainer.classList.contains("open")) {
            toggleFormBtn.innerText = "❌ 收起表單";
            toggleFormBtn.style.backgroundColor = "#2e7d32"; 
        } else {
            toggleFormBtn.innerText = "🪙 投幣許願";
            toggleFormBtn.style.backgroundColor = "#2980b9";
        }
    });

    document.getElementById("wishForm").addEventListener("submit", function(e) {
        e.preventDefault();
        
        const wantToLearnVal = document.getElementById("wantToLearn").value.trim();
        const wantToTeachVal = document.getElementById("wantToTeach").value.trim();

        if (wantToLearnVal === "" && wantToTeachVal === "") {
            alert("❌ 「想學的舞」或「想教的舞」請至少填寫一欄才能許願喔！");
            return;
        }

        const submitBtn = document.getElementById("submitBtn");
        submitBtn.disabled = true;
        submitBtn.innerText = "心願沉入池中...";

        const formData = {
            name: document.getElementById("name").value,
            wantToLearn: wantToLearnVal,
            wantToTeach: wantToTeachVal
        };

        fetch(GAS_URL, {
            method: "POST",
            mode: "no-cors", 
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(formData)
        })
        .then(() => {
            alert("✨ 許願成功！您的願望已沉入舞蹈許願池中！");
            document.getElementById("wantToLearn").value = "";
            document.getElementById("wantToTeach").value = "";
            submitBtn.disabled = false;
            submitBtn.innerText = "⛲ 投入許願池";
            formContainer.classList.remove("open");
            toggleFormBtn.innerText = "🪙 投幣許願";
            toggleFormBtn.style.backgroundColor = "#2980b9";
            fetchRanking();
        })
        .catch(error => {
            console.error("Error:", error);
            alert("送出失敗，請稍後再試。");
            submitBtn.disabled = false;
            submitBtn.innerText = "⛲ 投入許願池";
        });
    });

    function fetchRanking() {
        const loadingText = document.getElementById("loadingText");
        const scrollContainer = document.getElementById("scrollContainer");

        loadingText.style.display = "block";
        scrollContainer.style.display = "none";

        fetch(GAS_URL)
        .then(response => response.json())
        .then(data => {
            rawWishData = data;
            renderTable();
        })
        .catch(error => {
            console.error("Error:", error);
            loadingText.innerText = "無法載入許願池資料，請重新整理網頁。";
        });
    }

    function switchTab(tab) {
        if (currentTab === tab) return;
        currentTab = tab;
        document.getElementById('learnTabBtn').classList.toggle('active', tab === 'learn');
        document.getElementById('teachTabBtn').classList.toggle('active', tab === 'teach');
        
        const nameHeader = document.getElementById('nameHeader');
        nameHeader.innerText = tab === 'learn' ? "許願者" : "教舞者";
        
        renderTable();
    }

    function renderTable() {
        const loadingText = document.getElementById("loadingText");
        const scrollContainer = document.getElementById("scrollContainer");
        const rankingBody = document.getElementById("rankingBody");
        rankingBody.innerHTML = "";
        
        if (!rawWishData || rawWishData.length === 0) {
            loadingText.innerText = "目前許願池空空如也，快來許下第一個願望吧！";
            return;
        }
        
        let learnData = {}; 
        let teachData = {}; 
        
        rawWishData.forEach(item => {
            let userName = "不具名";
            if (item.name && item.name.toString().trim() !== "") {
                userName = item.name.toString().trim();
            }
            
            let learnDance = "";
            if (item.wantToLearn && item.wantToLearn.toString().trim() !== "") {
                learnDance = item.wantToLearn.toString().trim();
            }
            
            if (learnDance !== "") {
                if (!learnData[learnDance]) {
                    learnData[learnDance] = { names: [], count: 0 };
                }
                if (!learnData[learnDance].names.includes(userName)) {
                    learnData[learnDance].names.push(userName);
                }
                learnData[learnDance].count++;
            }
            
            if (item.wantToTeach && item.wantToTeach.toString().trim() !== "") {
                let teachDance = item.wantToTeach.toString().trim();
                if (!teachData[teachDance]) {
                    teachData[teachDance] = { names: [] };
                }
                if (!teachData[teachDance].names.includes(userName)) {
                    teachData[teachDance].names.push(userName);
                }
            }
        });
        
        let displayList = [];
        
        if (currentTab === 'learn') {
            for (let danceName in learnData) {
                let isMatch = teachData.hasOwnProperty(danceName);
                displayList.push({
                    dance: danceName,
                    namesStr: learnData[danceName].names.join('、'), 
                    count: learnData[danceName].count, // 💡 後台保留累計數據，用來作權重排序
                    isMatch: isMatch
                });
            }
            // 💡 排序機制原封不動：依然按照票數由多到少默默排好名次
            displayList.sort((a, b) => b.count - a.count);
            
        } else {
            for (let danceName in teachData) {
                let isMatch = learnData.hasOwnProperty(danceName);
                displayList.push({
                    dance: danceName,
                    namesStr: teachData[danceName].names.join('、'), 
                    count: 0,
                    isMatch: isMatch
                });
            }
            displayList.sort((a, b) => a.dance.localeCompare(b.dance, 'zh-Hant'));
        }
        
        if (displayList.length === 0) {
            let emptyMsg = currentTab === 'learn' ? '目前尚無學舞許願資料。' : '目前尚無教舞願望資料。';
            rankingBody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#7f8c8d; font-style:italic; padding:20px;">' + emptyMsg + '</td></tr>';
            loadingText.style.display = "none";
            scrollContainer.style.display = "block";
            return;
        }

        const maxDisplay = 15;
        const displayData = displayList.slice(0, maxDisplay);
        
        displayData.forEach((item, index) => {
            const row = document.createElement("tr");
            let danceClass = item.isMatch ? "match-dance" : "";
            
            // 💡 終極優化：不論是學舞還是教舞，前台全部統一輸出為最乾淨的三欄結構（名次、舞名、姓名）
            row.innerHTML = 
                '<td class="rank-num">' + (index + 1) + '</td>' +
                '<td class="dance-name-cell ' + danceClass + '">' + item.dance + '</td>' +
                '<td style="color: #555; font-size: 14px;">' + item.namesStr + '</td>';
            
            rankingBody.appendChild(row);
        });
        
        loadingText.style.display = "none";
        scrollContainer.style.display = "block";
    }
</script>
</body>
</html>
