<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桃園國際民俗舞社 - 舞蹈許願樹</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
            background-color: #fcfaf2; /* 溫潤的暖米色背景 */
            margin: 0;
            padding: 15px; /* 縮小邊距符合手機版 */
            color: #3e2723;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(46, 125, 50, 0.1);
            border-top: 6px solid #2e7d32; /* 頂部民俗深綠裝飾條 */
            box-sizing: border-box;
        }
        
        /* 橫幅左右圖片對齊結構 */
        .header-banner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
            padding: 5px 0;
        }
        .title-group {
            text-align: center;
        }
        
        /* 💡 完美重現：您挑選的民俗舞男女雙人舞剪影樣式 */
        .dance-pic {
            width: 55px; /* 精準控制尺寸，確保手機上能與文字並排不被擠壓 */
            height: 55px;
            fill: #2e7d32; /* 左側使用民俗深綠色 */
            flex-shrink: 0;
        }
        /* 右側圖片水平翻轉對稱 */
        .dance-pic.right {
            transform: scaleX(-1);
            fill: #d84315; /* 右側改用慶典橘紅，讓色彩活潑平衡 */
        }

        h1 {
            font-size: 21px; /* 稍微縮小字級，避免在小螢幕手機上換行 */
            color: #2e7d32;
            margin: 0;
            font-weight: bold;
            line-height: 1.3;
            letter-spacing: 1px;
        }
        h1 span {
            font-size: 15px;
            display: block;
            color: #d84315;
            margin-top: 5px;
            letter-spacing: 2px;
        }
        
        /* 表單與適合手機的表格結構 */
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #5d4037;
            font-size: 15px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 16px; /* 防止 iOS 自動放大的最佳尺寸 */
            background-color: #fff;
            color: #333;
        }
        input[type="text"]:focus {
            border-color: #2e7d32;
            outline: none;
            box-shadow: 0 0 0 2px rgba(46, 125, 50, 0.1);
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            letter-spacing: 1px;
        }
        button:hover {
            background-color: #1b5e20;
        }
        .ranking-section {
            margin-top: 35px;
            border-top: 2px dashed #e0e0e0;
            padding-top: 20px;
        }
        h2 {
            text-align: center;
            color: #2e7d32;
            font-size: 18px;
            margin-bottom: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
            font-size: 15px;
        }
        th {
            background-color: #f5f5f5;
            color: #5d4037;
            font-weight: bold;
        }
        tr:nth-child(even) td { 
            background-color: #fbfbfa; 
        }
        .rank-num {
            font-weight: bold;
            width: 50px;
            text-align: center;
        }
        .rank-1 { color: #ffb300; }
        .rank-2 { color: #9e9e9e; }
        .rank-3 { color: #cd7f32; }
        .rank-other { color: #8d6e63; }
        
        .vote-count {
            text-align: right;
            font-weight: bold;
            color: #d84315;
            width: 80px;
        }
        .loading {
            text-align: center;
            color: #7f8c8d;
            font-style: italic;
            padding: 15px;
        }
    </style>
</head>

1.5,-2.5,2.4,-5.3,2.7,-8.3 c0.1,-0.9,0.9,-1.6,1.8,-1.5 c0.9,0.1,1.6,0.9,1.5,1.8 C71.1,78,69.9,81.3,68.5,84.2 z"/>
        </svg>

        <!-- 中間社團文字 -->
        <div class="title-group">
            <h1>桃園國際民俗舞社</h1>
            <h1><span>✨ 舞蹈許願樹 ✨</span></h1>
        </div>

        <!-- 右側民俗舞者剪影（水平翻轉） -->
        <svg class="dance-pic right" viewBox="0 0 100 100">
            <path d="M62.5,5.2 c0.6,-1.3,0.3,-2.8,-0.8,-3.7 c-1.1,-0.9,-2.7,-0.9,-3.7,0.1 c-0.8,0.8,-1.7,1.8,-2.6,3 c-2,-0.9,-4.3,-1.4,-6.7,-1.4 c-2.6,0,-5.1,0.6,-7.3,1.7 c0.2,-0.5,0.3,-1.1,0.2,-1.7 c-0.1,-1.1,-0.8,-2,-1.8,-2.4 c-1.1,-0.4,-2.3,-0.1,-3.1,0.7 c-1.6,1.6,-2.8,3.7,-3.6,6 c-0.6,1.8,-0.9,3.7,-0.8,5.7 c0.1,1.5,0.5,2.9,1.2,4.2 c-0.1,0.8,-0.1,1.6,0.1,2.4 c0.5,2.1,1.7,3.9,3.4,5.1 c0.2,0.6,0.4,1.2,0.8,1.7 c1.1,1.6,3.1,2.3,5,1.7 c1.2,1.3,2.7,2.2,4.5,2.6 c0.3,1.9,0.1,3.9,-0.6,5.7 c-0.8,2,-2.1,3.8,-3.8,5.1 c-1.5,1.2,-3.3,1.9,-5.3,2 c-2.3,0.1,-4.6,-0.5,-6.5,-1.7 c-2.4,-1.5,-4.2,-3.8,-5.1,-6.6 c-0.5,-1.6,-0.6,-3.4,-0.3,-5.1 c0.3,-1.7,1,-3.3,2.1,-4.6 c1,-1.2,2.4,-2,3.9,-2.3 c0.6,-0.1,1,-0.5,1.2,-1.1 c0.2,-0.6,0,-1.2,-0.4,-1.6 c-1.3,-1.2,-2.2,-2.7,-2.7,-4.4 c-0.5,-1.7,-0.4,-3.6,0.2,-5.3 c0.6,-1.7,1.8,-3.1,3.3,-4.1 c1.5,-1,3.3,-1.4,5.1,-1.2 c1.1,0.1,2.2,0.5,3.1,1.1 c0.5,0.3,1.1,0.3,1.6,0 c1.4,-0.9,3.1,-1.4,4.8,-1.4 c1.8,0,3.5,0.5,4.9,1.5 c0.5,0.3,1.1,0.3,1.6,0 c0.8,-0.5,1.7,-0.8,2.7,-1 c0,-0.6,0.2,-1.1,0.6,-1.6 c0.9,-1.1,0.8,-2.7,-0.2,-3.7 c-1.1,-1,-2.7,-1.1,-3.8,-0.1 c-1.3,1.1,-2.4,2.5,-3.3,4.1 c-0.9,-0.2,-1.9,-0.3,-2.9,-0.3 c-2.9,0,-5.6,0.9,-7.9,2.5 c-1.5,-1.2,-3.5,-1.8,-5.5,-1.7 c-2.3,0.1,-4.5,1,-6.1,2.6 c-2.1,2.1,-3.2,5,-3.1,8 c0.1,2.4,1,4.7,2.5,6.5 c-1.4,1.4,-2.4,3.2,-2.9,5.2 c-0.6,2.4,-0.5,4.9,0.3,7.2 c1.1,3.4,3.4,6.3,6.5,8 c2.2,1.2,4.6,1.8,7.1,1.7 c1.6,-0.1,3.1,-0.5,4.5,-1.1 c1.1,1.6,2.7,2.8,4.6,3.4 c0.9,0.3,1.8,0.4,2.7,0.4 c2,0,4,-0.6,5.6,-1.7 c2.3,-1.6,3.9,-4,4.5,-6.8 c0.7,-3.1,0.1,-6.3,-1.6,-9.1 c1,-1.2,1.6,-2.7,1.7,-4.3 c0.1,-1.3,-0.2,-2.6,-0.8,-3.7 c1.5,-1,2.6,-2.4,3.2,-4.1 C63.6,10.6,63.4,7.7,62.5,5.2 z M43.2,74.5 c-0.8,-2.6,-2.2,-5,-4,-7.1 c-0.6,-0.7,-0.7,-1.7,-0.2,-2.5 c0.5,-0.8,1.5,-1.1,2.4,-0.7 c3,1.4,5.5,3.6,7.4,6.4 c1.2,1.8,2,3.8,2.5,6 c0.2,0.9,-0.3,1.8,-1.2,2.1 c-0.9,0.2,-1.8,-0.3,-2.1,-1.2 C47.6,76.3,45.6,75.3,43.2,74.5 z M68.5,84.2 c-2.5,4.2,-6.1,7.6,-10.3,9.8 c-0.8,0.4,-1.8,0.1,-2.3,-0.7 c-0.4,-0.8,-0.1,-1.8,0.7,-2.3 c3.6,-1.9,6.7,-4.8,8.8,-8.3 c         </svg>
    </div>
    
    <!-- 許願表單 -->
    <form id="wishForm">
        <div class="form-group">
            <label for="name">✍️ 舞士大名：</label>
            <input type="text" id="name" required placeholder="請輸入姓名或暱稱">
        </div>
        <div class="form-group">
            <label for="wantToLearn">🌱 最想學的民俗舞：</label>
            <input type="text" id="wantToLearn" required placeholder="例如：以色列之夜、匈牙利雙人舞">
        </div>
        <div class="form-group">
            <label for="wantToTeach">📢 願分享/教的舞蹈（選填）：</label>
            <input type="text" id="wantToTeach" placeholder="若有珍藏舞碼想分享請填寫">
        </div>
        <button type="submit" id="submitBtn">🎋 將心願掛上許願樹</button>
    </form>

    <!-- 排行榜佈告欄 -->
    <div class="ranking-section">
        <h2>🔥 眾人祈願 · 最想學舞蹈排行</h2>
        <div id="loadingText" class="loading">正在召集舞蹈數據中...</div>
        <table id="rankingTable" style="display: none;">
            <thead>
                <tr>
                    <th class="rank-num">名次</th>
                    <th>舞碼名稱</th>
                    <th class="vote-count">期待人數</th>
                </tr>
            </thead>
            <tbody id="rankingBody">
                <!-- 資料由 JavaScript 自動填入 -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzwXWm9nLJIrnQiOvqOPMjMptDH3tqPxpBVOLLB4bhSpbO8Mnn251qhk7Ix06Ka59XoYQ/exec";

    document.addEventListener("DOMContentLoaded", fetchRanking);

    document.getElementById("wishForm").addEventListener("submit", function(e) {
        e.preventDefault();
        
        const submitBtn = document.getElementById("submitBtn");
        submitBtn.disabled = true;
        submitBtn.innerText = "心願傳送中...🏮";

        const formData = {
            name: document.getElementById("name").value,
            wantToLearn: document.getElementById("wantToLearn").value,
            wantToTeach: document.getElementById("wantToTeach").value
        };

        fetch(GAS_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(formData)
        })
        .then(() => {
            alert("✨ 許願成功！您的心願已隨風掛上舞社許願樹！");
            document.getElementById("wishForm").reset();
            submitBtn.disabled = false;
            submitBtn.innerText = "🎋 將心願掛上許願樹";
            fetchRanking();
        })
        .catch(error => {
            console.error("Error:", error);
            alert("傳送失敗，可能風太大了，請稍後再試。");
            submitBtn.disabled = false;
            submitBtn.innerText = "🎋 將心願掛上許願樹";
        });
    });

    function fetchRanking() {
        const loadingText = document.getElementById("loadingText");
        const rankingTable = document.getElementById("rankingTable");
        const rankingBody = document.getElementById("rankingBody");

        loadingText.style.display = "block";
        rankingTable.style.display = "none";
        
        fetch(GAS_URL)
        .then(response => response.json())
        .then(data => {
            rankingBody.innerHTML = "";
            if (data.length === 0) {
                loadingText.innerText = "許願樹上空空如也，快來掛上第一個心願吧！";
                return;
            }
            
            data.forEach((item, index) => {
                const row = document.createElement("tr");
                
                let rankClass = "rank-other";
                if (index === 0) rankClass = "rank-1";
                else if (index === 1) rankClass = "rank-2";
                else if (index === 2) rankClass = "rank-3";
                
                row.innerHTML = `
                    <td class="rank-num ${rankClass}">${index + 1}</td>
                    <td>💃 ${item.dance}</td>
                    <td class="vote-count">${item.count} 票</td>
                `;
                rankingBody.appendChild(row);
            });
            
            loadingText.style.display = "none";
            rankingTable.style.display = "table";
        })
        .catch(error => {
            console.error("Error:", error);
            loadingText.innerText = "無法讀取許願樹，請重新整理試試看。";
        });
    }
</script>
</body>
</html>
